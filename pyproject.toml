faiss-cpu = "*"
openai = "*"
tiktoken = "*"
pandas = "*"
numpy = "*"
tabulate = "*"
ipython = "*"
matplotlib = "*"
pillow = "*"
python-dotenv = "*"
scikit-learn = "*"
scipy = "*"
influxdb-client = "*"
langgraph-supervisor= "*"
